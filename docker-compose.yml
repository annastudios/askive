# Runs Askive with its dependencies:
#   api       - the FastAPI app (built from ./Dockerfile), on http://localhost:8000
#   postgres  - users and who owns which document
#   chroma    - ChromaDB server holding chunks and embeddings
#   redis     - answer/embedding cache and chat memory
# Data lives in named volumes, so it survives `docker compose down` and
# rebuilds. Only `docker compose down -v` deletes it. The api container
# itself keeps no data.

services:
  api:
    build: .
    image: askive-api:latest
    ports:
      - "8000:8000"
    # API keys and JWT_SECRET come from your .env file at runtime.
    env_file: .env
    # These override .env, pointing the app at the other containers.
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://askive:${POSTGRES_PASSWORD:-askive-local-dev}@postgres:5432/askive
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: askive
      POSTGRES_DB: askive
      # Set POSTGRES_PASSWORD in .env to override. The default is only for
      # local use: this port is not published outside Docker's network.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askive-local-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "askive", "-d", "askive"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9   # must match the chromadb version in requirements.txt
    volumes:
      - chroma-data:/data
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    # Append-only file: cached data and chat memory survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  chroma-data:
  redis-data:
