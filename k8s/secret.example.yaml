# TEMPLATE ONLY - not applied by kustomization.yaml, never put real keys here.
#
# The real Secret is created from your local .env so keys never land in git:
#   kubectl create secret generic askive-secrets -n askive \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=VOYAGE_API_KEY=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL=postgresql+psycopg://askive:<POSTGRES_PASSWORD>@postgres:5432/askive
#
# Note: Secret values are only base64-encoded, not encrypted. Anyone who can
# read Secrets in the namespace can read the keys.
apiVersion: v1
kind: Secret
metadata:
  name: askive-secrets
  namespace: askive
type: Opaque
stringData:
  GEMINI_API_KEY: your-gemini-key
  VOYAGE_API_KEY: your-voyage-key
  JWT_SECRET: a-long-random-string
  POSTGRES_PASSWORD: another-long-random-string
  DATABASE_URL: postgresql+psycopg://askive:another-long-random-string@postgres:5432/askive
