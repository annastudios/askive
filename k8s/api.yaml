# The Askive API (FastAPI), built from the repo's Dockerfile.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data
  namespace: askive
spec:
  # Holds the SQLite user database. ReadWriteOnce still lets several API pods
  # share it on minikube's single node; a multi-node cluster would need a real
  # database server (e.g. Postgres) instead of SQLite.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: askive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Don't inject legacy service-link env vars (e.g. CHROMA_PORT=tcp://...):
      # ChromaDB reads every CHROMA_* variable as its own config and crashes on it.
      # Pods find each other by DNS name instead (chroma, redis).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000          # makes the mounted volume writable by that user
      containers:
        - name: api
          image: askive-api:latest
          # The image is loaded straight into minikube, not pulled from a registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: askive-config
            - secretRef:
                name: askive-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          # Requests = what the scheduler reserves; limits = the hard ceiling.
          # The HorizontalPodAutoscaler measures CPU against the request.
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          # Startup: give the app up to 2 minutes to boot before the other probes
          # count. Booting takes seconds when idle, but the autoscaler adds pods
          # exactly when CPU is saturated: under load a new pod needed over 60s
          # and was killed by a 60s budget before it ever served a request.
          startupProbe:
            httpGet: { path: /health/live, port: 8000 }
            periodSeconds: 2
            failureThreshold: 60
          # Liveness: is the process stuck? Failing restarts the container.
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: can it serve (ChromaDB, Redis, SQLite reachable)? Failing
          # only takes the pod out of the Service until it recovers - restarting
          # the API wouldn't fix a Redis outage.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: api-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: askive
spec:
  # NodePort exposes the Service on the cluster node; `minikube service`
  # tunnels it to your browser.
  type: NodePort
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
